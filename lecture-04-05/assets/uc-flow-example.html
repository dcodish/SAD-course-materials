ם ומציעה לעדכן אותו במקום להוסיף חדש"], "outcome": {"kind": "resume", "at": "2"}}, {"at": "3", "text": "המחיר או הכמות אינם תקינים (ערך שלילי או ריק)", "steps": ["המערכת מסמנת את השדה השגוי"], "outcome": {"kind": "resume", "at": "2"}}]}, {"id": "sc-view", "name": "צפייה בתפריט ובמלאי", "flow": [{"kind": "actor", "actor": "cafe-manager", "text": "פותח את מסך ניהול התפריט"}, {"kind": "system", "text": "מציגה טבלת פריטים — שם, קטגוריה, מחיר, כמות במלאי וסטטוס זמינות"}, {"kind": "actor", "actor": "cafe-manager", "text": "ממיין או מסנן את הטבלה — לפי קטגוריה או לפי פריטים שאזלו"}, {"kind": "system", "text": "מציגה את הרשימה המסוננת ומדגישה פריטים שכמותם במלאי נמוכה"}], "extensions": [{"at": "2", "text": "לקפיטריה אין עדיין פריטים בתפריט", "steps": ["המערכת מציגה מסך ריק עם הנחיה להוסיף פריט ראשון"], "outcome": {"kind": "terminate", "text": "אין תפריט לצפייה — נדרשת הוספת פריטים."}}]}, {"id": "sc-update", "name": "עדכון פריט וסימון \"אזל\"", "flow": [{"kind": "actor", "actor": "cafe-manager", "text": "בוחר פריט מטבלת התפריט"}, {"kind": "actor", "actor": "cafe-manager", "text": "מעדכן מחיר או כמות מלאי, או מסמן את הפריט \"אזל\""}, {"kind": "system", "text": "מוודאת שהערכים החדשים תקינים"}, {"kind": "system", "text": "שומרת את השינוי ומעדכנת את התצוגה לסטודנטים — פריט שסומן \"אזל\" מוצג \"לא זמין\" ואינו ניתן להזמנה"}], "extensions": [{"at": "3", "text": "הערך שהוזן אינו תקין (מחיר שלילי או כמות לא מספרית)", "steps": ["המערכת מסמנת את השדה השגוי ומשאירה את הערך הקודם בתוקף"], "outcome": {"kind": "resume", "at": "2"}}]}, {"id": "sc-delete", "name": "הסרת פריט מהתפריט", "flow": [{"kind": "actor", "actor": "cafe-manager", "text": "בוחר פריט ומפעיל \"הסרה מהתפריט\""}, {"kind": "system", "text": "מוודאת שהפריט אינו כלול בהזמנות פעילות שטרם נמסרו"}, {"kind": "system", "text": "מבקשת מהמנהל אישור להסרה"}, {"kind": "actor", "actor": "cafe-manager", "text": "מאשר את ההסרה"}, {"kind": "system", "text": "מסירה את הפריט מהתפריט ושומרת את נתוני המכירות ההיסטוריים שלו"}], "extensions": [{"at": "2", "text": "הפריט כלול בהזמנות פעילות", "steps": ["המערכת חוסמת את ההסרה ומציעה לסמן את הפריט \"אזל\" עד למסירת ההזמנות"], "outcome": {"kind": "terminate", "text": "הפריט לא הוסר — סומן \"אזל\" במקום."}}]}], "userStories": [{"role": "מנהל קפיטריה", "want": "לעדכן זמינות ומחירים מכל מקום בקפיטריה", "so": "הסטודנטים יראו מידע מדויק גם בשעות העומס"}, {"role": "מנהל קפיטריה", "want": "שפריט שאזל יוצג \"לא זמין\" מיד", "so": "סטודנטים לא יזמינו מנות שאינן קיימות"}], "wireframe": "<div class=\"wf-screen\"><div class=\"wf-heading\">ניהול תפריט ומלאי — קפיטריית הנדסה</div><table class=\"wf-table\"><thead><tr><th>פריט</th><th>קטגוריה</th><th>מחיר</th><th>מלאי</th><th>זמינות</th></tr></thead><tbody><tr><td>סלט יווני</td><td>עיקריות</td><td>28 ₪</td><td>12</td><td><span class=\"wf-badge\">זמין</span></td></tr><tr><td>כריך טונה</td><td>עיקריות</td><td>22 ₪</td><td>0</td><td><span class=\"wf-badge\">אזל</span></td></tr></tbody></table><div class=\"wf-actions\"><button class=\"wf-button wf-primary\">הוסף פריט</button><button class=\"wf-button\">שמור שינויים</button><button class=\"wf-button\">הסר פריט</button></div><p class=\"wf-hint\">פריט שסומן \"אזל\" מוצג לסטודנטים \"לא זמין\" — הוא אינו נמחק מהתפריט.</p></div>"}};
var actorDescriptions = {"student": {"name": "סטודנט", "desc": "סטודנט בקמפוס המזמין אוכל מהקפיטריות דרך האפליקציה — מעיין, מזמין, משלם, עוקב ואוסף."}, "counter-staff": {"name": "עובד דלפק", "desc": "עובד דלפק האיסוף — מאמת שההזמנה שולמה ושייכת לסטודנט שמולו, ומוסר אותה."}, "cafe-manager": {"name": "מנהל קפיטריה", "desc": "מנהל הקפיטריה — אחראי לתפריט, למחירים ולמלאי המוצגים לסטודנטים."}};

/* Flow renderer — lifted verbatim from sad-mcp uc-diagram-common.js so this example
   renders identically to the modal behind the diagram. */
function ucEsc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function ucOutcomeHtml(outcome) {
  if (!outcome) return '';
  if (outcome.kind === 'resume')
    return `<div class="ext-outcome ext-resume">↩ חזרה לשלב ${ucEsc(outcome.at)}</div>`;
  if (outcome.kind === 'terminate')
    return `<div class="ext-outcome ext-terminate">⛔ המקרה מסתיים ללא הצלחה${
      outcome.text ? ' — ' + ucEsc(outcome.text) : ''}</div>`;
  return '';
}

function ucExtensionHtml(ext, label, letter) {
  // Legacy extensions (text-only, pre-2.6) carry the whole sentence in `text`
  // and already read as prose — don't prefix them with "אם".
  const structured = Array.isArray(ext.steps) || !!ext.outcome;
  const head = structured
    ? `אם ${ucEsc(ext.text)}:`
    : ucEsc(ext.text);
  const subSteps = (ext.steps || []).length
    ? `<ul class="ext-steps">${(ext.steps || []).map((s, k) =>
        `<li><span class="step-label">${label}${letter}${k + 1}</span>${ucEsc(s)}</li>`).join('')}</ul>`
    : '';
  return `<li class="ext-sub"><span class="step-label ext-label">${label}${letter}</span>${head}` +
         `${subSteps}${ucOutcomeHtml(ext.outcome)}</li>`;
}

function ucStepBodyHtml(step, ctx) {
  if (step.kind === 'actor')
    return `<strong class="step-actor" data-actor-id="${ucEsc(step.actor)}">${ucEsc(ctx.actorName(step.actor))}</strong>: ${ucEsc(step.text)}`;
  if (step.kind === 'system')
    return `<em class="step-system">המערכת</em>: ${ucEsc(step.text)}`;
  if (step.kind === 'include')
    return `<span class="step-include">«include» </span><a class="step-uc-ref" data-uc-ref="${ucEsc(step.uc)}">${ucEsc(ctx.ucName(step.uc))}</a>${step.text ? ' — ' + ucEsc(step.text) : ''}`;
  if (step.kind === 'extension')  // legacy inline extension pseudo-step
    return ucEsc(step.text);
  return ucEsc(step.text);
}

function ucFlowHtml(flow, prefix, extByAt, ctx) {
  let html = '<ul class="flow">';
  (flow || []).forEach((step, i) => {
    const label = `${prefix}${i + 1}`;

    if (step.kind === 'loop') {
      html += `<li class="flow-step flow-loop"><span class="step-label">${label}</span>` +
              `<span class="ctrl-kw">חזור</span> <span class="ctrl-cond">${ucEsc(step.condition)}</span>:` +
              ucFlowHtml(step.steps, `${label}.`, extByAt, ctx) + '</li>';
    } else if (step.kind === 'alt') {
      let branches = '<ul class="flow-branches">';
      (step.branches || []).forEach((b, bi) => {
        const bLabel = `${label}.${bi + 1}`;
        branches += `<li class="flow-branch"><span class="step-label">${bLabel}</span>` +
                    `<span class="branch-label">${ucEsc(b.label)}</span>` +
                    ucFlowHtml(b.steps, `${bLabel}.`, extByAt, ctx) + '</li>';
      });
      branches += '</ul>';
      html += `<li class="flow-step flow-alt"><span class="step-label">${label}</span>` +
              `<span class="ctrl-kw">לפי</span> <span class="ctrl-cond">${ucEsc(step.condition)}</span>:` +
              branches + '</li>';
    } else if (step.kind === 'extension') {
      html += `<li class="ext-inline">${step.at ? ucEsc(step.at) + 'a. ' : ''}${ucEsc(step.text)}</li>`;
    } else {
      html += `<li class="flow-step"><span class="step-label">${label}</span>${ucStepBodyHtml(step, ctx)}</li>`;
    }

    const exts = extByAt.get(label) || [];
    if (exts.length)
      html += '<li class="ext-holder"><ul class="ext-list">' +
              exts.map((e, j) => ucExtensionHtml(e, label, String.fromCharCode(97 + j))).join('') +
              '</ul></li>';
  });
  return html + '</ul>';
}

var RAIL_NOTE = {
  'uc-order-pay':   'תרחיש אחד — אבל בתוכו לולאה, החלטה עסקית ושלושה חריגים.',
  'uc-manage-menu': 'ארבעה תרחישים — אחד לכל פעולת CRUD. זה מה ש-״ניהול X״ מחייב.'
};

var ctx = {
  actorName: function (id) { return (actorDescriptions[id] || {}).name || id; },
  ucName:    function (id) { return (useCaseDocs[id] || {}).name || id; }
};

var currentUc = 'uc-order-pay';
var currentSc = 0;

function li(items) {
  return (items || []).map(function (s) { return '<li>' + ucEsc(s) + '</li>'; }).join('');
}

function renderFlow() {
  var doc = useCaseDocs[currentUc];
  var sce = doc.scenarios[currentSc];
  var extByAt = new Map();
  (sce.extensions || []).forEach(function (e) {
    var at = String(e.at == null ? '' : e.at);
    if (!extByAt.has(at)) extByAt.set(at, []);
    extByAt.get(at).push(e);
  });
  document.getElementById('flow').innerHTML =
    '<h3>' + ucEsc(sce.name || sce.id) + '</h3>' + ucFlowHtml(sce.flow, '', extByAt, ctx);
}

function renderRail() {
  var doc = useCaseDocs[currentUc];
  document.getElementById('sc-count').textContent = '(' + doc.scenarios.length + ')';
  document.getElementById('rail-note').textContent = RAIL_NOTE[currentUc] || '';
  var rail = document.getElementById('rail');
  rail.innerHTML = '';
  doc.scenarios.forEach(function (sc, i) {
    var b = document.createElement('button');
    b.className = 'sc';
    b.setAttribute('aria-selected', String(i === currentSc));
    b.innerHTML = '<span class="n">' + (i + 1) + '</span>' + ucEsc(sc.name || sc.id);
    b.onclick = function () { currentSc = i; renderRail(); renderFlow(); };
    rail.appendChild(b);
  });
}

function renderUc() {
  var doc = useCaseDocs[currentUc];
  document.getElementById('uc-name').textContent  = doc.name;
  document.getElementById('uc-actor').textContent = ctx.actorName(doc.primaryActor);
  document.getElementById('uc-pre').innerHTML  = li(doc.preconditions);
  document.getElementById('uc-post').innerHTML = li(doc.postconditions);
  renderRail();
  renderFlow();
}

function renderPicker() {
  var p = document.getElementById('picker');
  p.innerHTML = '';
  Object.keys(useCaseDocs).forEach(function (id) {
    var b = document.createElement('button');
    b.className = 'uc-pick';
    b.setAttribute('aria-selected', String(id === currentUc));
    b.textContent = useCaseDocs[id].name;
    b.onclick = function () { currentUc = id; currentSc = 0; renderPicker(); renderUc(); };
    p.appendChild(b);
  });
}

document.body.classList.toggle('embed', /\bembed\b/.test(location.search));
renderPicker();
renderUc();
</script>
