  const RELS = [

  /* ============================================================
     2. ENGINE — SKILL.md §9d, plus two additive hooks:
        · boxW honours an optional cls.minW  (so «external system» headers fit)
        · svgBox honours cls.isExternal      (gray dashed "outside our system" look)
     ============================================================ */
  // ── Constants ─────────────────────────────────────────────────────────────
  const HDR_H = 28, PAD = 6, LINE_H = 14, DIV_H = 1;
  const FM = 'font-family="IBM Plex Mono, monospace"';

  function escXml(s) {
    return String(s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function boxH(cls) {
    const hdrH = cls.stereotype ? 38 : HDR_H;
    return hdrH + PAD + cls.attrs.length * LINE_H +
      (cls.ops.length > 0 ? DIV_H + cls.ops.length * LINE_H : 0) + PAD;
  }

  function boxW(cls) {
    const longest = [...cls.attrs, ...cls.ops, cls.name]
      .reduce((m, s) => Math.max(m, s.length), 0);
    return Math.max(120, cls.minW || 0, Math.ceil(longest * 6.5) + 16);
  }

  function svgBox(cls) {
    const w = boxW(cls), h = boxH(cls), { x, y } = cls;
    const hdrH = cls.stereotype ? 38 : HDR_H;
    const ext = !!cls.isExternal;
    const border   = (cls.isEnum || ext) ? '#94a3b8' : '#3b82f6';
    const hdrFill  = cls.isEnum ? '#475569' : ext ? '#64748b' : '#1e40af';
    const bodyFill = cls.isEnum ? '#f8fafc' : ext ? '#e2e8f0' : 'white';
    const dash     = (cls.isEnum || ext) ? 'stroke-dasharray="5 3"' : '';

    let s = `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${bodyFill}" stroke="${border}" stroke-width="2" ${dash} rx="2"/>`;
    s += `<rect x="${x}" y="${y}" width="${w}" height="${hdrH}" fill="${hdrFill}" rx="2"/>`;

    if (cls.stereotype) {
      s += `<text x="${x + w/2}" y="${y + 13}" text-anchor="middle" fill="white" font-size="9" ${FM}>${escXml(cls.stereotype)}</text>`;
    }
    const nameStyle = cls.isAbstract ? 'font-style:italic' : '';
    const nameY = cls.stereotype ? y + hdrH - 8 : y + hdrH / 2 + 4;
    s += `<text x="${x + w/2}" y="${nameY}" text-anchor="middle" fill="white" font-size="11" font-weight="700" ${FM} style="${nameStyle}">${escXml(cls.name)}</text>`;

    const divY = y + hdrH;
    s += `<line x1="${x}" y1="${divY}" x2="${x + w}" y2="${divY}" stroke="${border}" stroke-width="1"/>`;

    const attrFill  = ext ? '#475569' : '#1e293b';
    const attrStyle = ext ? ' font-style="italic"' : '';
    let curY = divY + PAD + 10;
    for (const a of cls.attrs) {
      s += `<text x="${x + 6}" y="${curY}" text-anchor="start" fill="${attrFill}" font-size="10.5"${attrStyle} ${FM}>${escXml(a)}</text>`;
      curY += LINE_H;
    }
    if (cls.ops.length > 0) {
      const opDivY = divY + PAD + cls.attrs.length * LINE_H;
      s += `<line x1="${x}" y1="${opDivY}" x2="${x + w}" y2="${opDivY}" stroke="${border}" stroke-width="1"/>`;
      curY = opDivY + PAD + 10;
      for (const o of cls.ops) {
        s += `<text x="${x + 6}" y="${curY}" text-anchor="start" fill="#2563eb" font-size="10.5" font-style="italic" ${FM}>${escXml(o)}</text>`;
        curY += LINE_H;
      }
    }
    return `<g class="cd-class" data-id="${cls.id}">${s}</g>`;
  }

  function svgRel(rel) {
    const pts = rel.points.map(([px, py]) => `${px},${py}`).join(' ');
    let mS = '', mE = '', dash = '';
    if (rel.type === 'comp') mS = 'marker-start="url(#compFill)"';
    if (rel.type === 'agg')  mS = 'marker-start="url(#aggHollow)"';
    if (rel.type === 'gen')  mE = 'marker-end="url(#genHollow)"';
    if (rel.type === 'dep')  { mE = 'marker-end="url(#arrOpen)"'; dash = 'stroke-dasharray="6 3"'; }
    // 'assoc': no markers — plain line

    let s = `<polyline class="cd-edge" points="${pts}" fill="none" stroke="#334155" stroke-width="1.8" ${dash} ${mS} ${mE}/>`;
    // Multiplicity labels — placed just OUTSIDE each box, offset along the line
    // (away from the box) and beside it, so BOTH ends are always legible.
    // On a VERTICAL segment the perpendicular offset is horizontal, so it must
    // clear half the label's own width — otherwise the line runs through "1..*".
    const multLabel = (end, adj, txt) => {
      const dx = adj[0] - end[0], dy = adj[1] - end[1];
      const L = Math.hypot(dx, dy) || 1, ux = dx / L, uy = dy / L;
      const perp = Math.abs(uy) > Math.abs(ux) ? 9 + txt.length * 3.9 : 10;
      const x = end[0] + ux * 22 - uy * perp, y = end[1] + uy * 22 + ux * perp + 3;
      return `<text x="${x}" y="${y}" text-anchor="middle" fill="#475569" font-size="11.5" font-weight="700" ${FM}>${escXml(txt)}</text>`;
    };
    if (rel.fromMult) s += multLabel(rel.points[0], rel.points[1], rel.fromMult);
    if (rel.toMult) {
      const n = rel.points.length;
      s += multLabel(rel.points[n - 1], rel.points[n - 2], rel.toMult);
    }
    if (rel.label) {
      const mid = rel.points[Math.floor(rel.points.length / 2)];
      s += `<text x="${mid[0]}" y="${mid[1] - 6}" text-anchor="middle" fill="#64748b" font-size="9.5" ${FM}>${escXml(rel.label)}</text>`;
    }
    return s;
  }

  // ── Legend — real SVG samples so each marker is the one actually used ───────
  function svgLegend(totalHeight) {
    const yL = totalHeight - 44, yT = yL + 4;
    const items = [
      { label: 'Association',    attrs: '' },
      { label: 'Aggregation',    attrs: 'marker-start="url(#aggHollow)"' },
      { label: 'Composition',    attrs: 'marker-start="url(#compFill)"' },
      { label: 'Generalization', attrs: 'marker-end="url(#genHollow)"' },
      { label: 'Dependency',     attrs: 'marker-end="url(#arrOpen)" stroke-dasharray="6 3"' }
    ];
    let s = '', x = 24;
    for (const it of items) {
      s += `<line x1="${x}" y1="${yL}" x2="${x + 36}" y2="${yL}" stroke="#334155" stroke-width="1.8" ${it.attrs}/>`;
      s += `<text x="${x + 43}" y="${yT}" text-anchor="start" fill="#475569" font-size="12.5" ${FM}>${it.label}</text>`;
      x += 36 + 43 + it.label.length * 7.6 + 26;
    }
    s += `<text x="${x + 6}" y="${yT}" text-anchor="start" fill="#64748b" font-size="12.5" ${FM}>קרדינליות בשני הקצוות</text>`;
    return s;
  }

  // ── Hover highlight ─────────────────────────────────────────────────────────
  // Point at any relationship line to trace it through crossings: it brightens,
  // thickens, and lifts to the front, restoring on mouse-out. A wide transparent
  // overlay makes the thin line easy to grab. Call wireHover(svg) after innerHTML.
  function wireHover(svg) {
    svg.querySelectorAll('.cd-edge').forEach(function (line) {
      const hit = line.cloneNode(false);
      hit.removeAttribute('marker-start'); hit.removeAttribute('marker-end');
      hit.removeAttribute('class');
      hit.setAttribute('stroke', 'transparent');
      hit.setAttribute('stroke-width', '16');
      hit.setAttribute('fill', 'none');
      hit.style.pointerEvents = 'stroke';
      hit.style.cursor = 'pointer';
      line.parentNode.insertBefore(hit, line.nextSibling); // transparent overlay on top
      const s0 = line.getAttribute('stroke');
      const w0 = line.getAttribute('stroke-width');
      let slot = null;
      hit.addEventListener('mouseenter', function () {
        slot = document.createComment('e'); hit.parentNode.insertBefore(slot, hit);
        const p = hit.parentNode; p.appendChild(line); p.appendChild(hit); // lift to front
        line.setAttribute('stroke', '#e6007e');
        line.setAttribute('stroke-width', String(Math.max(3.4, parseFloat(w0 || '1.8') + 1.6)));
      });
      hit.addEventListener('mouseleave', function () {
        line.setAttribute('stroke', s0); if (w0) line.setAttribute('stroke-width', w0);
        if (slot && slot.parentNode) {
          slot.parentNode.insertBefore(line, slot);
          slot.parentNode.insertBefore(hit, slot);
          slot.remove();
        }
        slot = null;
      });
    });
  }

  // ── Click a class → show its description ───────────────────────────────────
  function hideInfo() {
    document.getElementById('cd-info').hidden = true;
    document.querySelectorAll('.cd-class.sel').forEach(g => g.classList.remove('sel'));
  }
  function showInfo(cls, g) {
    document.querySelectorAll('.cd-class.sel').forEach(n => n.classList.remove('sel'));
    if (g) g.classList.add('sel');
    document.getElementById('cd-info-title').textContent = cls.name;
    document.getElementById('cd-info-body').innerHTML = cls.desc || '';
    document.getElementById('cd-info').hidden = false;
    const hint = document.getElementById('cd-hint');
    if (hint) hint.style.opacity = '0';
  }
  function wireClicks(svg) {
    const byId = {};
    for (const c of CLASSES) byId[c.id] = c;
    svg.querySelectorAll('.cd-class').forEach(function (g) {
      g.addEventListener('click', function (ev) {
        ev.stopPropagation();
        const cls = byId[g.getAttribute('data-id')];
        if (!cls) return;
        if (g.classList.contains('sel')) hideInfo(); else showInfo(cls, g);
      });
    });
    svg.addEventListener('click', hideInfo);
  }

  function render() {
    // Orthogonality guard (§4 validation): every segment must share x or y.
    for (const rel of RELS) {
      for (let i = 0; i < rel.points.length - 1; i++) {
        const a = rel.points[i], b = rel.points[i + 1];
        if (a[0] !== b[0] && a[1] !== b[1]) {
          console.warn('Diagonal segment', rel.from, '->', rel.to, 'at index', i);
        }
      }
    }

    let maxX = 600, maxY = 400;
    for (const cls of CLASSES) {
      maxX = Math.max(maxX, cls.x + boxW(cls) + 60);
      maxY = Math.max(maxY, cls.y + boxH(cls) + 80);
    }

    const defs = `<defs>
      <pattern id="dotgrid" width="24" height="24" patternUnits="userSpaceOnUse">
        <circle cx="12" cy="12" r="0.8" fill="#cbd5e1"/>
      </pattern>
      <marker id="genHollow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto">
        <polygon points="0,0 10,5 0,10" fill="white" stroke="#334155" stroke-width="1.5"/>
      </marker>
      <marker id="arrOpen" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
        <polyline points="0,0 9,4 0,8" fill="none" stroke="#334155" stroke-width="1.5"/>
      </marker>
      <marker id="compFill" markerWidth="14" markerHeight="10" refX="1" refY="5" orient="auto">
        <polygon points="0,5 7,0 14,5 7,10" fill="#1e40af" stroke="#1e40af"/>
      </marker>
      <marker id="aggHollow" markerWidth="14" markerHeight="10" refX="1" refY="5" orient="auto">
        <polygon points="0,5 7,0 14,5 7,10" fill="white" stroke="#334155"/>
      </marker>
    </defs>`;

    // totalWidth / totalHeight include margins and space for the legend.
    // RIGHT_MARGIN ≥ 40px, BOTTOM_MARGIN ≥ 70px (legend needs ~50px).
    // These are already baked into maxX / maxY from the loop above (60px / 80px).
    const totalWidth  = maxX;
    const totalHeight = maxY;   // legend drawn at totalHeight - 44, inside this height

    const bg    = `<rect width="${totalWidth}" height="${totalHeight}" fill="url(#dotgrid)"/>`;
    const rels  = RELS.map(svgRel).join('');
    const boxes = CLASSES.map(svgBox).join('');
    const legend = svgLegend(totalHeight);

    const svg = document.getElementById('diagram-svg');
    svg.setAttribute('width',   totalWidth);
    svg.setAttribute('height',  totalHeight);
    svg.setAttribute('viewBox', `0 0 ${totalWidth} ${totalHeight}`);
    svg.innerHTML = defs + bg + rels + boxes + legend;
    wireHover(svg);
    wireClicks(svg);
  }

  /* ============================================================
     3. VP EXPORT — from export-buttons.md (class-diagram xmiBody)
     ============================================================ */
  function xmlEscape(s) {
    return String(s ?? '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&apos;');
  }

  function downloadFile(filename, mimeType, content) {
    const blob = new Blob([content], { type: mimeType });
    const url  = URL.createObjectURL(blob);
    const a    = Object.assign(document.createElement('a'),
                   { href: url, download: filename });
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1000);
  }

  function xmiBody(elements, rels) {
    const lines = [];
    for (const el of elements) {
      if (el.kind === 'class') {
        const isEnum = el.stereotype === 'enumeration';
        const type = isEnum ? 'uml:Enumeration' : 'uml:Class';
        lines.push(`    <packagedElement xmi:type="${type}" xmi:id="${el.id}" name="${xmlEscape(el.name)}"${el.isAbstract?' isAbstract="true"':''}>`);
        if (isEnum) {
          for (const a of (el.attributes || []))
            lines.push(`      <ownedLiteral xmi:id="${el.id}_${xmlEscape(a.name)}" name="${xmlEscape(a.name)}"/>`);
        } else {
          for (const a of (el.attributes || []))
            lines.push(`      <ownedAttribute xmi:id="${el.id}_${xmlEscape(a.name)}" name="${xmlEscape(a.name)}" visibility="${a.visibility==='+'?'public':a.visibility==='-'?'private':'protected'}"/>`);
          for (const op of (el.operations || []))
            lines.push(`      <ownedOperation xmi:id="${el.id}_${xmlEscape(op.name)}" name="${xmlEscape(op.name)}"/>`);
        }
        lines.push(`    </packagedElement>`);
      }
    }
    for (const r of rels) {
      if (r.kind === 'generalization')
        lines.push(`    <packagedElement xmi:type="uml:Generalization" xmi:id="${r.id}" specific="${r.from}" general="${r.to}"/>`);
      if (r.kind === 'association')
        lines.push(`    <packagedElement xmi:type="uml:Association" xmi:id="${r.id}" memberEnd="${r.from}_end ${r.to}_end"/>`);
      if (r.kind === 'dependency')
        lines.push(`    <packagedElement xmi:type="uml:Dependency" xmi:id="${r.id}" client="${r.from}" supplier="${r.to}"/>`);
    }
    return lines.join('\n');
  }

  function exportXMI() {
    const m = diagramModel;
    const title = xmlEscape(m.title || 'diagram');
    const allElements = m.parts.flatMap(p => p.elements);
    const allRelationships = m.parts.flatMap(p => p.relationships);
    const body = xmiBody(allElements, allRelationships);

    const xmi = `<?xml version="1.0" encoding="UTF-8"?>
<xmi:XMI xmi:version="2.1"
  xmlns:xmi="http://www.omg.org/XMI"
  xmlns:uml="http://www.eclipse.org/uml2/5.0.0/UML">
  <uml:Model xmi:id="model_1" name="${title}">
${body}
  </uml:Model>
</xmi:XMI>`;

    downloadFile(title.replace(/\s+/g, '_') + '.xmi', 'application/xml', xmi);
  }
