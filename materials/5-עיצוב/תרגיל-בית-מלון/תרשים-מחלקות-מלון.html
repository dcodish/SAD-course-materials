<!DOCTYPE html>
<html lang="he">
<head>
<meta charset="UTF-8">
<title>מלון 'גלי הים' — תרשים מחלקות</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,700;1,400&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px; background: #eef2f7; font-family: 'Rubik', sans-serif; color: #1e293b; }
  .page { max-width: 1360px; margin: 0 auto; }
  header.top {
    background: #1e40af; color: #fff; border-radius: 10px 10px 0 0;
    padding: 18px 26px; direction: rtl; text-align: right;
  }
  header.top h1 { margin: 0 0 4px 0; font-size: 20px; font-weight: 700; }
  header.top p { margin: 0; font-size: 13px; color: #dbeafe; }
  .diagram-wrap {
    background: #fff; border: 1px solid #cbd5e1; border-top: none;
    border-radius: 0 0 10px 10px; padding: 10px; overflow-x: auto; direction: ltr;
  }
  svg { display: block; }
  .vp-export-btn {
    position: fixed; bottom: 20px; right: 20px; z-index: 1000;
    background: #1e40af; color: #fff; border: none; border-radius: 6px;
    padding: 8px 16px; font-size: 13px; cursor: pointer;
    font-family: 'IBM Plex Mono', monospace;
  }
  .vp-export-btn:hover { background: #1e3a8a; }
  body.embed { overflow: hidden; margin: 0; padding: 0; background: #fff; }
  body.embed .vp-export-btn,
  body.embed .top { display: none; }
  body.embed .page { padding: 0; margin: 0; border: 0; box-shadow: none; max-width: none; }
  body.embed .diagram-wrap { padding: 0; border: 0; }
  body.embed svg { width: 100vw; height: 100vh; max-width: none; }
</style>
</head>
<body>
<div class="page">
  <header class="top">
    <h1>מלון 'גלי הים' — תרשים מחלקות (מודל תחום)</h1>
    <p>פלט <span dir="ltr">sad-mcp</span> לתרגיל הבית של הרצאה 8 — 6 מחלקות + 3 ספירות (<span dir="ltr">enumerations</span>) + מערכת חיצונית אחת. תרשים המצבים מצויר עבור <span dir="ltr">Booking.status : BookingStatus</span></p>
  </header>
  <div class="diagram-wrap">
    <svg id="diagram-svg" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>
</div>

<button class="vp-export-btn" onclick="exportXMI()">Download .xmi (Visual Paradigm)</button>

<script>
if (location.search.includes('embed=1')) document.body.classList.add('embed');
/* ── 1. DATA ─────────────────────────────────────────────────────────────── */

const CLASSES = [
  { id: 'Guest', name: 'Guest', stereotype: null, isEnum: false, isExternal: false, isAbstract: false,
    attrs: ['+ name : String', '+ idNumber : String', '+ phone : String', '+ email : String', '+ cardToken : String'], ops: [],
    x: 40, y: 60 },

  { id: 'Booking', name: 'Booking', stereotype: null, isEnum: false, isExternal: false, isAbstract: false,
    attrs: ['+ bookingNumber : String', '+ arrivalDate : Date', '+ departureDate : Date', '+ guestCount : Integer',
            '+ nightlyRate : Money', '+ status : BookingStatus'],
    ops: ['+ balance() : Money'],
    x: 300, y: 60 },

  { id: 'RoomType', name: 'RoomType', stereotype: null, isEnum: false, isExternal: false, isAbstract: false,
    attrs: ['+ name : String', '+ maxGuests : Integer', '+ nightlyRate : Money'],
    ops: ['+ isAvailable(from : Date, to : Date) : Boolean'],
    x: 620, y: 60 },

  { id: 'Room', name: 'Room', stereotype: null, isEnum: false, isExternal: false, isAbstract: false,
    attrs: ['+ roomNumber : String', '+ floor : Integer', '+ inService : Boolean'], ops: [],
    x: 980, y: 60 },

  { id: 'BookingStatus', name: 'BookingStatus', stereotype: '«enumeration»', isEnum: true, isExternal: false, isAbstract: false,
    attrs: ['New', 'Confirmed', 'Active', 'Completed', 'Cancelled'], ops: [],
    x: 300, y: 280 },

  { id: 'Charge', name: 'Charge', stereotype: null, isEnum: false, isExternal: false, isAbstract: false,
    attrs: ['+ chargeType : ChargeType', '+ amount : Money', '+ chargeDate : Date', '+ status : ChargeStatus', '+ clearingRef : String'],
    ops: [],
    x: 620, y: 280 },

  { id: 'ExtraService', name: 'ExtraService', stereotype: null, isEnum: false, isExternal: false, isAbstract: false,
    attrs: ['+ name : String', '+ price : Money'], ops: [],
    x: 980, y: 280 },

  { id: 'ChargeType', name: 'ChargeType', stereotype: '«enumeration»', isEnum: true, isExternal: false, isAbstract: false,
    attrs: ['Deposit', 'Night', 'ExtraService', 'NoShowFee', 'Refund'], ops: [],
    x: 620, y: 460 },

  { id: 'ChargeStatus', name: 'ChargeStatus', stereotype: '«enumeration»', isEnum: true, isExternal: false, isAbstract: false,
    attrs: ['Pending', 'Paid', 'Failed'], ops: [],
    x: 800, y: 460 },

  { id: 'PaymentGateway', name: 'PaymentGateway', stereotype: '«external system»', isEnum: false, isExternal: true, isAbstract: false,
    attrs: [], ops: [],
    x: 1180, y: 330 }
];

const RELS = [
  { type: 'assoc', from: 'Guest', to: 'Booking', fromMult: '1', toMult: '0..*',
    fromRole: null, toRole: null, label: null,
    points: [[186, 102], [300, 102]] },

  { type: 'assoc', from: 'Booking', to: 'RoomType', fromMult: '0..*', toMult: '1',
    fromRole: null, toRole: null, label: null,
    points: [[472, 102], [620, 102]] },

  { type: 'assoc', from: 'RoomType', to: 'Room', fromMult: '1', toMult: '1..*',
    fromRole: null, toRole: null, label: null,
    points: [[911, 102], [980, 102]] },

  // room assigned at check-in — a booking has at most one room; a room hosts many bookings over time
  { type: 'assoc', from: 'Booking', to: 'Room', fromMult: '0..*', toMult: '0..1',
    fromRole: null, toRole: null, label: null,
    points: [[386, 60], [386, 36], [1060, 36], [1060, 60]] },

  // composition: a charge cannot exist without its booking and belongs to exactly one booking
  { type: 'comp', from: 'Booking', to: 'Charge', fromMult: '1', toMult: '0..*',
    fromRole: null, toRole: null, label: null,
    points: [[450, 199], [450, 320], [620, 320]] },

  { type: 'assoc', from: 'Charge', to: 'ExtraService', fromMult: '0..*', toMult: '0..1',
    fromRole: null, toRole: null, label: null,
    points: [[799, 306], [980, 306]] },

  { type: 'dep', from: 'Charge', to: 'PaymentGateway', fromMult: null, toMult: null,
    fromRole: null, toRole: null, label: null,
    points: [[799, 356], [1180, 356]] }
];

/* ── 2. ENGINE (§9d, verbatim) ───────────────────────────────────────────── */

const HDR_H = 28, PAD = 6, LINE_H = 14, DIV_H = 1;
const FM = 'font-family="IBM Plex Mono, monospace"';

function escXml(s) {
  return String(s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function boxH(cls) {
  const hdrH = cls.stereotype ? 38 : HDR_H;
  return hdrH + PAD + cls.attrs.length * LINE_H +
    (cls.ops.length > 0 ? DIV_H + cls.ops.length * LINE_H : 0) + PAD;
}

function boxW(cls) {
  const longest = [...cls.attrs, ...cls.ops, cls.name, cls.stereotype || '']
    .reduce((m, s) => Math.max(m, s.length), 0);
  return Math.max(120, Math.ceil(longest * 6.5) + 16);
}

function svgBox(cls) {
  const w = boxW(cls), h = boxH(cls), { x, y } = cls;
  const hdrH = cls.stereotype ? 38 : HDR_H;
  const border   = cls.isEnum ? '#94a3b8' : cls.isExternal ? '#64748b' : '#3b82f6';
  const hdrFill  = cls.isEnum ? '#475569' : cls.isExternal ? '#64748b' : '#1e40af';
  const bodyFill = cls.isEnum ? '#f8fafc' : cls.isExternal ? '#f1f5f9' : 'white';
  const dash     = cls.isEnum ? 'stroke-dasharray="5 3"' : '';

  let s = `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${bodyFill}" stroke="${border}" stroke-width="2" ${dash} rx="2"/>`;
  s += `<rect x="${x}" y="${y}" width="${w}" height="${hdrH}" fill="${hdrFill}" rx="2"/>`;

  if (cls.stereotype) {
    s += `<text x="${x + w/2}" y="${y + 13}" text-anchor="middle" fill="white" font-size="9" ${FM}>${escXml(cls.stereotype)}</text>`;
  }
  const nameStyle = cls.isAbstract ? 'font-style:italic' : '';
  const nameY = cls.stereotype ? y + hdrH - 8 : y + hdrH / 2 + 4;
  s += `<text x="${x + w/2}" y="${nameY}" text-anchor="middle" fill="white" font-size="11" font-weight="700" ${FM} style="${nameStyle}">${escXml(cls.name)}</text>`;

  const divY = y + hdrH;
  s += `<line x1="${x}" y1="${divY}" x2="${x + w}" y2="${divY}" stroke="${border}" stroke-width="1"/>`;

  let curY = divY + PAD + 10;
  for (const a of cls.attrs) {
    s += `<text x="${x + 6}" y="${curY}" text-anchor="start" fill="#1e293b" font-size="10.5" ${FM}>${escXml(a)}</text>`;
    curY += LINE_H;
  }
  if (cls.ops.length > 0) {
    const opDivY = divY + PAD + cls.attrs.length * LINE_H;
    s += `<line x1="${x}" y1="${opDivY}" x2="${x + w}" y2="${opDivY}" stroke="${border}" stroke-width="1"/>`;
    curY = opDivY + PAD + 10;
    for (const o of cls.ops) {
      s += `<text x="${x + 6}" y="${curY}" text-anchor="start" fill="#2563eb" font-size="10.5" font-style="italic" ${FM}>${escXml(o)}</text>`;
      curY += LINE_H;
    }
  }
  return s;
}

function svgRel(rel) {
  const pts = rel.points.map(([px, py]) => `${px},${py}`).join(' ');
  let mS = '', mE = '', dash = '';
  if (rel.type === 'comp') mS = 'marker-start="url(#compFill)"';
  if (rel.type === 'agg')  mS = 'marker-start="url(#aggHollow)"';
  if (rel.type === 'gen')  mE = 'marker-end="url(#genHollow)"';
  if (rel.type === 'dep')  { mE = 'marker-end="url(#arrOpen)"'; dash = 'stroke-dasharray="6 3"'; }

  let s = `<polyline class="cd-edge" points="${pts}" fill="none" stroke="#334155" stroke-width="1.8" ${dash} ${mS} ${mE}/>`;
  const multLabel = (end, adj, txt) => {
    const dx = adj[0] - end[0], dy = adj[1] - end[1];
    const L = Math.hypot(dx, dy) || 1, ux = dx / L, uy = dy / L;
    const x = end[0] + ux * 16 - uy * 9, y = end[1] + uy * 16 + ux * 9 + 3;
    return `<text x="${x}" y="${y}" text-anchor="middle" fill="#64748b" font-size="9.5" ${FM}>${escXml(txt)}</text>`;
  };
  if (rel.fromMult) s += multLabel(rel.points[0], rel.points[1], rel.fromMult);
  if (rel.toMult) {
    const n = rel.points.length;
    s += multLabel(rel.points[n - 1], rel.points[n - 2], rel.toMult);
  }
  if (rel.label) {
    const mid = rel.points[Math.floor(rel.points.length / 2)];
    s += `<text x="${mid[0]}" y="${mid[1] - 6}" text-anchor="middle" fill="#64748b" font-size="9.5" ${FM}>${escXml(rel.label)}</text>`;
  }
  return s;
}

function wireHover(svg) {
  svg.querySelectorAll('.cd-edge').forEach(function (line) {
    const hit = line.cloneNode(false);
    hit.removeAttribute('marker-start'); hit.removeAttribute('marker-end');
    hit.removeAttribute('class');
    hit.setAttribute('stroke', 'transparent');
    hit.setAttribute('stroke-width', '16');
    hit.setAttribute('fill', 'none');
    hit.style.pointerEvents = 'stroke';
    hit.style.cursor = 'pointer';
    line.parentNode.insertBefore(hit, line.nextSibling);
    const s0 = line.getAttribute('stroke');
    const w0 = line.getAttribute('stroke-width');
    let slot = null;
    hit.addEventListener('mouseenter', function () {
      slot = document.createComment('e'); hit.parentNode.insertBefore(slot, hit);
      const p = hit.parentNode; p.appendChild(line); p.appendChild(hit);
      line.setAttribute('stroke', '#e6007e');
      line.setAttribute('stroke-width', String(Math.max(3.4, parseFloat(w0 || '1.8') + 1.6)));
    });
    hit.addEventListener('mouseleave', function () {
      line.setAttribute('stroke', s0); if (w0) line.setAttribute('stroke-width', w0);
      if (slot && slot.parentNode) {
        slot.parentNode.insertBefore(line, slot);
        slot.parentNode.insertBefore(hit, slot);
        slot.remove();
      }
      slot = null;
    });
  });
}

function render() {
  let maxX = 600, maxY = 400;
  for (const cls of CLASSES) {
    maxX = Math.max(maxX, cls.x + boxW(cls) + 60);
    maxY = Math.max(maxY, cls.y + boxH(cls) + 80);
  }

  const defs = `<defs>
    <pattern id="dotgrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="0.8" fill="#cbd5e1"/>
    </pattern>
    <marker id="genHollow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto">
      <polygon points="0,0 10,5 0,10" fill="white" stroke="#334155" stroke-width="1.5"/>
    </marker>
    <marker id="arrOpen" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polyline points="0,0 9,4 0,8" fill="none" stroke="#334155" stroke-width="1.5"/>
    </marker>
    <marker id="compFill" markerWidth="14" markerHeight="10" refX="1" refY="5" orient="auto">
      <polygon points="0,5 7,0 14,5 7,10" fill="#1e40af" stroke="#1e40af"/>
    </marker>
    <marker id="aggHollow" markerWidth="14" markerHeight="10" refX="1" refY="5" orient="auto">
      <polygon points="0,5 7,0 14,5 7,10" fill="white" stroke="#334155"/>
    </marker>
  </defs>`;

  const totalWidth  = maxX;
  const totalHeight = maxY;

  const bg    = `<rect width="${totalWidth}" height="${totalHeight}" fill="url(#dotgrid)"/>`;
  const rels  = RELS.map(svgRel).join('');
  const boxes = CLASSES.map(svgBox).join('');
  const hasDep  = RELS.some(r => r.type === 'dep');
  const depLeg  = hasDep ? '  ⇢ Dependency («external system»)' : '';
  const legend = `<text x="16" y="${totalHeight - 60}" fill="#64748b" font-size="9" ${FM}>── Association  ◆── Composition  ──▷ Generalization${depLeg}  |  קרדינליות בשני קצות הקשר</text>`;

  const svg = document.getElementById('diagram-svg');
  svg.setAttribute('width',   totalWidth);
  svg.setAttribute('height',  totalHeight);
  svg.setAttribute('viewBox', `0 0 ${totalWidth} ${totalHeight}`);
  svg.innerHTML = defs + bg + rels + boxes + legend;
  wireHover(svg);
}

/* ── 3. diagramModel (model-shape.md, kind:'class') ──────────────────────── */

function buildModel() {
  const parseMember = (s) => {
    const m = s.match(/^([+\-#])?\s*([^:()]+?)\s*(\([^)]*\))?\s*(?::\s*(.+))?\s*$/);
    return {
      visibility: m && m[1] ? m[1] : '+',
      name: m ? m[2].trim() : s,
      type: m && m[4] ? m[4].trim() : null,
      isOp: !!(m && m[3])
    };
  };
  const elements = CLASSES.map(c => {
    if (c.isEnum) {
      return { kind: 'class', id: c.id, name: c.name, isAbstract: false,
        stereotype: 'enumeration',
        attributes: c.attrs.map(v => ({ visibility: '', name: v, type: null, defaultValue: null, constraint: null })),
        operations: [], x: c.x, y: c.y, w: boxW(c), h: boxH(c) };
    }
    return { kind: 'class', id: c.id, name: c.name, isAbstract: c.isAbstract,
      stereotype: c.stereotype ? c.stereotype.replace(/[«»]/g, '').trim() : null,
      attributes: c.attrs.map(a => { const p = parseMember(a);
        return { visibility: p.visibility, name: p.name, type: p.type, defaultValue: null, constraint: null }; }),
      operations: c.ops.map(o => { const p = parseMember(o);
        return { visibility: p.visibility, name: p.name, params: [], returnType: p.type }; }),
      x: c.x, y: c.y, w: boxW(c), h: boxH(c) };
  });

  const relationships = [];
  RELS.forEach((r, i) => {
    if (r.type === 'dep') {
      relationships.push({ kind: 'dependency', id: r.id || ('dep_' + i), from: r.from, to: r.to, stereotype: null });
      return;
    }
    if (r.type === 'gen') {
      relationships.push({ kind: 'generalization', id: r.id || ('gen_' + i), from: r.from, to: r.to });
      return;
    }
    relationships.push({ kind: 'association', id: r.id || ('assoc_' + i),
      from: r.from, to: r.to, multFrom: r.fromMult, multTo: r.toMult,
      roleFrom: r.fromRole, roleTo: r.toRole, directed: false,
      aggregation: r.type === 'agg', composition: r.type === 'comp' });
  });
  return {
    kind: 'class',
    title: "מלון 'גלי הים', Class Diagram",
    parts: [ { id: 'part-1', label: 'Hotel Booking', splitRationale: '', elements, relationships } ]
  };
}

const diagramModel = buildModel();

/* ── 4. VP export (export-buttons.md) ────────────────────────────────────── */

function xmlEscape(s) {
  return String(s ?? '')
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&apos;');
}

function downloadFile(filename, mimeType, content) {
  const blob = new Blob([content], { type: mimeType });
  const url  = URL.createObjectURL(blob);
  const a    = Object.assign(document.createElement('a'), { href: url, download: filename });
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1000);
}

function xmiBody(elements, rels) {
  const lines = [];
  for (const el of elements) {
    if (el.kind === 'class') {
      const isEnum = el.stereotype === 'enumeration';
      const tag = isEnum ? 'uml:Enumeration' : 'uml:Class';
      lines.push(`    <packagedElement xmi:type="${tag}" xmi:id="${el.id}" name="${xmlEscape(el.name)}"${el.isAbstract ? ' isAbstract="true"' : ''}>`);
      if (isEnum) {
        for (const a of el.attributes)
          lines.push(`      <ownedLiteral xmi:id="${el.id}_${a.name}" name="${xmlEscape(a.name)}"/>`);
      } else {
        for (const a of el.attributes)
          lines.push(`      <ownedAttribute xmi:id="${el.id}_${a.name}" name="${xmlEscape(a.name)}" visibility="${a.visibility === '+' ? 'public' : a.visibility === '-' ? 'private' : 'protected'}"/>`);
        for (const op of el.operations)
          lines.push(`      <ownedOperation xmi:id="${el.id}_${op.name}" name="${xmlEscape(op.name)}"/>`);
      }
      lines.push(`    </packagedElement>`);
    }
  }
  for (const r of rels) {
    if (r.kind === 'generalization')
      lines.push(`    <packagedElement xmi:type="uml:Generalization" xmi:id="${r.id}" specific="${r.from}" general="${r.to}"/>`);
    if (r.kind === 'association')
      lines.push(`    <packagedElement xmi:type="uml:Association" xmi:id="${r.id}" memberEnd="${r.from}_end ${r.to}_end"/>`);
    if (r.kind === 'dependency')
      lines.push(`    <packagedElement xmi:type="uml:Dependency" xmi:id="${r.id}" client="${r.from}" supplier="${r.to}"/>`);
  }
  return lines.join('\n');
}

function exportXMI() {
  const m = diagramModel;
  const title = xmlEscape(m.title || 'diagram');
  const allElements = m.parts.flatMap(p => p.elements);
  const allRelationships = m.parts.flatMap(p => p.relationships);
  const body = xmiBody(allElements, allRelationships);
  const xmi = `<?xml version="1.0" encoding="UTF-8"?>
<xmi:XMI xmi:version="2.1" xmlns:xmi="http://schema.omg.org/spec/XMI/2.1" xmlns:uml="http://www.eclipse.org/uml2/3.0.0/UML">
  <uml:Model xmi:id="model" name="${title}">
${body}
  </uml:Model>
</xmi:XMI>`;
  downloadFile('hotel_class_diagram.xmi', 'application/xml', xmi);
}

document.addEventListener('DOMContentLoaded', render);
</script>
</body>
</html>
