// ── Constants ─────────────────────────────────────────────────────────────
const HDR_H = 28, PAD = 6, LINE_H = 14, DIV_H = 1;
const FM = 'font-family="IBM Plex Mono, monospace"';

function escXml(s) {
  return String(s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function boxH(cls) {
  const hdrH = cls.stereotype ? 38 : HDR_H;
  return hdrH + PAD + cls.attrs.length * LINE_H +
    (cls.ops.length > 0 ? DIV_H + cls.ops.length * LINE_H : 0) + PAD;
}

function boxW(cls) {
  // The stereotype counts: «external system» is wider than most class names.
  const longest = [...cls.attrs, ...cls.ops, cls.name, cls.stereotype || '']
    .reduce((m, s) => Math.max(m, s.length), 0);
  return Math.max(120, Math.ceil(longest * 6.5) + 16);
}

function svgBox(cls) {
  const w = boxW(cls), h = boxH(cls), { x, y } = cls;
  const hdrH = cls.stereotype ? 38 : HDR_H;
  // Three looks: domain class (blue), enumeration (gray dashed), «external system» (gray solid).
  const border   = cls.isEnum ? '#94a3b8' : cls.isExternal ? '#64748b' : '#3b82f6';
  const hdrFill  = cls.isEnum ? '#475569' : cls.isExternal ? '#64748b' : '#1e40af';
  const bodyFill = cls.isEnum ? '#f8fafc' : cls.isExternal ? '#f1f5f9' : 'white';
  const dash     = cls.isEnum ? 'stroke-dasharray="5 3"' : '';

  let s = `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${bodyFill}" stroke="${border}" stroke-width="2" ${dash} rx="2"/>`;
  s += `<rect x="${x}" y="${y}" width="${w}" height="${hdrH}" fill="${hdrFill}" rx="2"/>`;

  if (cls.stereotype) {
    s += `<text x="${x + w/2}" y="${y + 13}" text-anchor="middle" fill="white" font-size="9" ${FM}>${escXml(cls.stereotype)}</text>`;
  }
  const nameStyle = cls.isAbstract ? 'font-style:italic' : '';
  const nameY = cls.stereotype ? y + hdrH - 8 : y + hdrH / 2 + 4;
  s += `<text x="${x + w/2}" y="${nameY}" text-anchor="middle" fill="white" font-size="11" font-weight="700" ${FM} style="${nameStyle}">${escXml(cls.name)}</text>`;

  const divY = y + hdrH;
  s += `<line x1="${x}" y1="${divY}" x2="${x + w}" y2="${divY}" stroke="${border}" stroke-width="1"/>`;

  let curY = divY + PAD + 10;
  for (const a of cls.attrs) {
    s += `<text x="${x + 6}" y="${curY}" text-anchor="start" fill="#1e293b" font-size="10.5" ${FM}>${escXml(a)}</text>`;
    curY += LINE_H;
  }
  if (cls.ops.length > 0) {
    const opDivY = divY + PAD + cls.attrs.length * LINE_H;
    s += `<line x1="${x}" y1="${opDivY}" x2="${x + w}" y2="${opDivY}" stroke="${border}" stroke-width="1"/>`;
    curY = opDivY + PAD + 10;
    for (const o of cls.ops) {
      s += `<text x="${x + 6}" y="${curY}" text-anchor="start" fill="#2563eb" font-size="10.5" font-style="italic" ${FM}>${escXml(o)}</text>`;
      curY += LINE_H;
    }
  }
  return s;
}

function svgRel(rel) {
  const pts = rel.points.map(([px, py]) => `${px},${py}`).join(' ');
  let mS = '', mE = '', dash = '';
  if (rel.type === 'comp') mS = 'marker-start="url(#compFill)"';
  if (rel.type === 'agg')  mS = 'marker-start="url(#aggHollow)"';
  if (rel.type === 'gen')  mE = 'marker-end="url(#genHollow)"';
  if (rel.type === 'dep')  { mE = 'marker-end="url(#arrOpen)"'; dash = 'stroke-dasharray="6 3"'; }
  // 'assoc': no markers (plain line)

  let s = `<polyline class="cd-edge" points="${pts}" fill="none" stroke="#334155" stroke-width="1.8" ${dash} ${mS} ${mE}/>`;
  // Multiplicity labels: placed just OUTSIDE each box, offset along the line
  // (away from the box) and beside it, so BOTH ends are always legible.
  const multLabel = (end, adj, txt) => {
    const dx = adj[0] - end[0], dy = adj[1] - end[1];
    const L = Math.hypot(dx, dy) || 1, ux = dx / L, uy = dy / L;
    const x = end[0] + ux * 16 - uy * 9, y = end[1] + uy * 16 + ux * 9 + 3;
    return `<text x="${x}" y="${y}" text-anchor="middle" fill="#64748b" font-size="9.5" ${FM}>${escXml(txt)}</text>`;
  };
  if (rel.fromMult) s += multLabel(rel.points[0], rel.points[1], rel.fromMult);
  if (rel.toMult) {
    const n = rel.points.length;
    s += multLabel(rel.points[n - 1], rel.points[n - 2], rel.toMult);
  }
  if (rel.label) {
    const mid = rel.points[Math.floor(rel.points.length / 2)];
    s += `<text x="${mid[0]}" y="${mid[1] - 6}" text-anchor="middle" fill="#64748b" font-size="9.5" ${FM}>${escXml(rel.label)}</text>`;
  }
  return s;
}

// ── Hover highlight ─────────────────────────────────────────────────────────
// Point at any relationship line to trace it through crossings: it brightens,
// thickens, and lifts to the front, restoring on mouse-out. A wide transparent
// overlay makes the thin line easy to grab. Call wireHover(svg) after innerHTML.
function wireHover(svg) {
  svg.querySelectorAll('.cd-edge').forEach(function (line) {
    const hit = line.cloneNode(false);
    hit.removeAttribute('marker-start'); hit.removeAttribute('marker-end');
    hit.removeAttribute('class');
    hit.setAttribute('stroke', 'transparent');
    hit.setAttribute('stroke-width', '16');
    hit.setAttribute('fill', 'none');
    hit.style.pointerEvents = 'stroke';
    hit.style.cursor = 'pointer';
    line.parentNode.insertBefore(hit, line.nextSibling); // transparent overlay on top
    const s0 = line.getAttribute('stroke');
    const w0 = line.getAttribute('stroke-width');
    let slot = null;
    hit.addEventListener('mouseenter', function () {
      slot = document.createComment('e'); hit.parentNode.insertBefore(slot, hit);
      const p = hit.parentNode; p.appendChild(line); p.appendChild(hit); // lift to front
      line.setAttribute('stroke', '#e6007e');
      line.setAttribute('stroke-width', String(Math.max(3.4, parseFloat(w0 || '1.8') + 1.6)));
    });
    hit.addEventListener('mouseleave', function () {
      line.setAttribute('stroke', s0); if (w0) line.setAttribute('stroke-width', w0);
      if (slot && slot.parentNode) {
        slot.parentNode.insertBefore(line, slot);
        slot.parentNode.insertBefore(hit, slot);
        slot.remove();
      }
      slot = null;
    });
  });
}

function render() {
  let maxX = 600, maxY = 400;
  for (const cls of CLASSES) {
    maxX = Math.max(maxX, cls.x + boxW(cls) + 60);
    maxY = Math.max(maxY, cls.y + boxH(cls) + 80);
  }

  const defs = `<defs>
    <pattern id="dotgrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="0.8" fill="#cbd5e1"/>
    </pattern>
    <marker id="genHollow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto">
      <polygon points="0,0 10,5 0,10" fill="white" stroke="#334155" stroke-width="1.5"/>
    </marker>
    <marker id="arrOpen" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polyline points="0,0 9,4 0,8" fill="none" stroke="#334155" stroke-width="1.5"/>
    </marker>
    <marker id="compFill" markerWidth="14" markerHeight="10" refX="1" refY="5" orient="auto">
      <polygon points="0,5 7,0 14,5 7,10" fill="#1e40af" stroke="#1e40af"/>
    </marker>
    <marker id="aggHollow" markerWidth="14" markerHeight="10" refX="1" refY="5" orient="auto">
      <polygon points="0,5 7,0 14,5 7,10" fill="white" stroke="#334155"/>
    </marker>
  </defs>`;

  // totalWidth / totalHeight include margins and space for the legend.
  // RIGHT_MARGIN ≥ 40px, BOTTOM_MARGIN ≥ 70px (legend needs ~50px).
  // These are already baked into maxX / maxY from the loop above (60px / 80px).
  const totalWidth  = maxX;
  const totalHeight = maxY;   // legend drawn at totalHeight - 60, inside this height

  const bg    = `<rect width="${totalWidth}" height="${totalHeight}" fill="url(#dotgrid)"/>`;
  const rels  = RELS.map(svgRel).join('');
  const boxes = CLASSES.map(svgBox).join('');
  // Legend is placed at totalHeight - 60 so it always lands inside the viewBox.
  // The dependency entry appears only when the diagram actually has one (§7).
  const hasDep  = RELS.some(r => r.type === 'dep');
  const depLeg  = hasDep ? '  ⇢ Dependency («external system»)' : '';
  const legend = `<text x="16" y="${totalHeight - 60}" fill="#64748b" font-size="9" ${FM}>── Association  ◇── Aggregation  ◆── Composition  ──▷ Generalization${depLeg}  |  Multiplicity at both ends of every association</text>`;

  const svg = document.getElementById('diagram-svg');
  svg.setAttribute('width',   totalWidth);
  svg.setAttribute('height',  totalHeight);
  svg.setAttribute('viewBox', `0 0 ${totalWidth} ${totalHeight}`);
  svg.innerHTML = defs + bg + rels + boxes + legend;
  wireHover(svg);
}

    /* 2b. Engine additions for this diagram (the 9d engine has no drawing for these):
       - 'assocClass' relationship: the dashed tether from an association's midpoint to its
         association class (no arrowhead, no multiplicity), section 3.
       - package frames (section 2, Packages) on the overview part, drawn behind the classes. */
    const svgRelBase = svgRel;
    svgRel = function (rel) {
      if (rel.type !== 'assocClass') return svgRelBase(rel);
      const pts = rel.points.map(([px, py]) => `${px},${py}`).join(' ');
      return `<polyline class="cd-edge" points="${pts}" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="5 4"/>`;
    };
    const renderBase = render;
    render = function () {
      renderBase();
      if (!PACKAGES || !PACKAGES.length) return;
      const svg = document.getElementById('diagram-svg');
      const frames = PACKAGES.map(p => {
        const tw = p.name.length * 7 + 20;
        const tx = p.tab && p.tab[1] === 'r' ? p.x + p.w - tw : p.x;
        const ty = p.tab && p.tab[0] === 'b' ? p.y + p.h : p.y - 18;
        return `<rect x="${p.x}" y="${p.y}" width="${p.w}" height="${p.h}" fill="#eef2ff" fill-opacity="0.55" stroke="#6366f1" stroke-width="1.2"/>` +
          `<rect x="${tx}" y="${ty}" width="${tw}" height="18" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.2"/>` +
          `<text x="${tx + 8}" y="${ty + 13}" fill="#3730a3" font-size="10.5" font-weight="700" ${FM}>${escXml(p.name)}</text>`;
      }).join('');
      svg.querySelector('rect').insertAdjacentHTML('afterend', frames);
    };

    /* 2c. Tabs (section 9e): each tab re-renders the SVG with its part's data */
    function showPart(i) {
      CLASSES = PARTS[i].classes; RELS = PARTS[i].rels; PACKAGES = PARTS[i].packages;
      document.getElementById('diagram-title').textContent = TITLE + ' | ' + PARTS[i].label;
      document.getElementById('split-rationale').textContent = PARTS[i].splitRationale;
      document.querySelectorAll('.tab-btn').forEach((b, j) => b.classList.toggle('active', i === j));
      render();
    }
    function buildTabs() {
      const bar = document.getElementById('tab-bar');
      PARTS.forEach((p, i) => {
        const b = document.createElement('button');
        b.className = 'tab-btn'; b.textContent = p.label; b.onclick = () => showPart(i);
        bar.appendChild(b);
      });
    }

    /* 3. VP EXPORT (export-buttons.md) */
    function xmlEscape(s) {
      return String(s ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&apos;');
    }

    function downloadFile(filename, mimeType, content) {
      const blob = new Blob([content], { type: mimeType });
      const url  = URL.createObjectURL(blob);
      const a    = Object.assign(document.createElement('a'),
                     { href: url, download: filename });
      document.body.appendChild(a);
      a.click();
      setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1000);
    }

    function xmiBody(elements, rels) {
      const lines = [];
      const seen = new Set();
      for (const el of elements) {
        if (el.kind !== 'class' || el.isStub || seen.has(el.id)) continue;
        seen.add(el.id);
        const isEnum = el.stereotype === 'enumeration';
        const tag = isEnum ? 'uml:Enumeration' : 'uml:Class';
        lines.push(`    <packagedElement xmi:type="${tag}" xmi:id="${el.id}" name="${xmlEscape(el.name)}"${el.isAbstract ? ' isAbstract="true"' : ''}>`);
        if (isEnum) {
          for (const a of el.attributes)
            lines.push(`      <ownedLiteral xmi:id="${el.id}_${a.name}" name="${xmlEscape(a.name)}"/>`);
        } else {
          for (const a of el.attributes)
            lines.push(`      <ownedAttribute xmi:id="${el.id}_${a.name.replace(/\W/g, '')}" name="${xmlEscape(a.name)}" visibility="${a.visibility === '+' ? 'public' : a.visibility === '-' ? 'private' : 'protected'}"/>`);
          for (const op of el.operations)
            lines.push(`      <ownedOperation xmi:id="${el.id}_${op.name}" name="${xmlEscape(op.name)}"/>`);
        }
        lines.push(`    </packagedElement>`);
      }
      const done = new Set();
      for (const r of rels) {
        if (done.has(r.id)) continue;
        done.add(r.id);
        if (r.kind === 'generalization')
          lines.push(`    <packagedElement xmi:type="uml:Generalization" xmi:id="${r.id}" specific="${r.from}" general="${r.to}"/>`);
        if (r.kind === 'association')
          lines.push(`    <packagedElement xmi:type="uml:Association" xmi:id="${r.id}" memberEnd="${r.from}_end ${r.to}_end"/>`);
        if (r.kind === 'dependency')
          lines.push(`    <packagedElement xmi:type="uml:Dependency" xmi:id="${r.id}" client="${r.from}" supplier="${r.to}"/>`);
        if (r.kind === 'associationClass')
          lines.push(`    <packagedElement xmi:type="uml:AssociationClass" xmi:id="${r.id}" name="${xmlEscape(r.classId)}"/>`);
      }
      return lines.join('\n');
    }

    function exportXMI() {
      const m = diagramModel;
      const title = xmlEscape(m.title || 'diagram');
      const allElements = m.parts.flatMap(p => p.elements);
      const allRelationships = m.parts.flatMap(p => p.relationships);
      const body = xmiBody(allElements, allRelationships);
      const xmi = `<?xml version="1.0" encoding="UTF-8"?>
<xmi:XMI xmi:version="2.1"
  xmlns:xmi="http://www.omg.org/XMI"
  xmlns:uml="http://www.eclipse.org/uml2/5.0.0/UML">
  <uml:Model xmi:id="model_1" name="${title}">
${body}
  </uml:Model>
</xmi:XMI>`;
      downloadFile(title.replace(/\s+/g, '_') + '.xmi', 'application/xml', xmi);
    }

    /* 4. diagramModel (model-shape.md, kind: 'class') */
    function buildModel() {
      const parseMember = (s) => {
        const m = s.match(/^([+\-#])?\s*([^:()]+?)\s*(\([^)]*\))?\s*(?::\s*(.+))?\s*$/);
        return { visibility: m && m[1] ? m[1] : '+', name: m ? m[2].trim() : s, type: m && m[4] ? m[4].trim() : null };
      };
      const parts = PARTS.map(p => {
        const elements = p.classes.map(c => {
          const stereo = c.isEnum ? 'enumeration' : c.isExternal ? 'external system'
            : (c.stereotype && c.stereotype.startsWith('«')) ? c.stereotype.replace(/[«»]/g, '').trim() : null;
          return { kind: 'class', id: c.id.replace(/@.*$/, ''), name: c.name, isAbstract: !!c.isAbstract,
            stereotype: stereo, isStub: !!(c.stereotype && c.stereotype.startsWith('(')),
            attributes: c.attrs.map(a => { if (c.isEnum) return { visibility: '', name: a, type: null, defaultValue: null, constraint: null };
              const q = parseMember(a); return { visibility: q.visibility, name: q.name, type: q.type, defaultValue: null, constraint: null }; }),
            operations: c.ops.map(o => { const q = parseMember(o); return { visibility: q.visibility, name: q.name, params: [], returnType: q.type }; }),
            x: c.x, y: c.y, w: boxW(c), h: boxH(c) };
        });
        const base = id => id.replace(/@.*$/, '');
        const relationships = p.rels.map(r => {
          if (r.type === 'gen') return { kind: 'generalization', id: r.id, from: base(r.from), to: base(r.to) };
          if (r.type === 'dep') return { kind: 'dependency', id: r.id, from: base(r.from), to: base(r.to), stereotype: null };
          if (r.type === 'assocClass') return { kind: 'associationClass', id: r.id, classId: base(r.to), assocId: r.assocId };
          return { kind: 'association', id: r.id, from: base(r.from), to: base(r.to), multFrom: r.fromMult, multTo: r.toMult,
            roleFrom: r.fromRole, roleTo: r.toRole, directed: false, aggregation: false, composition: r.type === 'comp' };
        });
        return { id: p.id, label: p.label, splitRationale: p.splitRationale, elements, relationships };
      });
      return { kind: 'class', title: TITLE, parts };
    }
    const diagramModel = buildModel();

    document.addEventListener('DOMContentLoaded', () => {
      buildTabs();
      const m = location.hash.match(/part-(\d+)/);
      showPart(m ? Math.min(+m[1] - 1, PARTS.length - 1) : 0);
    });
  </script>
</body>
</html>
